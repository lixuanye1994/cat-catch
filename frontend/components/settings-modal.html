<div v-if="store.settingsOpen" class="modal-mask" @click.self="store.settingsOpen = false">
    <div class="modal">
        <h2>设置</h2>
        <label class="form-row">
            <span>ffmpeg.exe 路径</span>
            <input v-model="formSettings.ffmpeg_path" type="text"
                   placeholder="例如 C:\ffmpeg\bin\ffmpeg.exe" />
        </label>
        <label class="form-row">
            <span>ffprobe.exe 路径（可选）</span>
            <input v-model="formSettings.ffprobe_path" type="text"
                   placeholder="留空则自动与 ffmpeg 同目录匹配" />
        </label>
        <label class="form-row">
            <span>下载保存目录</span>
            <input v-model="formSettings.output_dir" type="text" />
        </label>
        <label class="form-row">
            <span>B 站 SESSDATA（可选，解锁高清/会员画质）</span>
            <input v-model="formSettings.bilibili_sessdata" type="text"
                   placeholder="登录 B 站后从 Cookie 中复制 SESSDATA" />
        </label>
        <p v-if="settingsError" class="error-text">{{ settingsError }}</p>
        <div class="modal-actions">
            <button class="btn" @click="store.settingsOpen = false">取消</button>
            <button class="btn primary" @click="saveSettings">保存</button>
        </div>
    </div>
</div>
